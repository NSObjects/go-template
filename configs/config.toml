[system]
port = ":9322"
#1 = debug , 2 = online
level = 1
# 环境配置: dev, test, prod
env = "dev"

# ============================================================
# MySQL 配置模板
# ============================================================
[database]
driver = "mysql"
host = "localhost"
port = 3306
user = "root"
password = "secret"
database = "myapp"
charset = "utf8mb4"
timezone = "Local"
max_idle_conns = 10
max_open_conns = 100
max_lifetime = 300
conn_max_idle_time = 60

# ============================================================
# PostgreSQL 配置模板
# ============================================================
# [database]
# driver = "postgres"
# host = "localhost"
# port = 5432
# user = "postgres"
# password = "secret"
# database = "myapp"
# ssl_mode = "disable"
# schema = "public"
# timezone = "Asia/Shanghai"
# max_idle_conns = 10
# max_open_conns = 100
# max_lifetime = 300
# conn_max_idle_time = 60

# ============================================================
# SQLite 配置模板
# ============================================================
# [database]
# driver = "sqlite"
# database = "./data.db"  # or ":memory:"
# max_idle_conns = 1
# max_open_conns = 1

[mongodb]
host = ""
port = "27017"
user = ""
password = ""

[log]
# 日志级别: debug, info, warn, error
level = "debug"
# 日志格式: color(开发), json(生产)
format = "color"

[log.console]
format = "color"  # json, text, color
output = "stdout" # stdout, stderr

[log.file]
# 文件日志配置 - 生产环境启用
filename = "logs/app.log"
max_size = 100    # MB
max_backups = 3
max_age = 28      # days
compress = true
format = "json"   # json, text

[log.elasticsearch]
url = ""
index = "echo-admin-logs"
timeout = "5s"

[log.loki]
url = ""
labels = { service = "echo-admin", env = "dev" }
timeout = "5s"

[jwt]
secret = "tn)M^P<j,/6$Gr/Wrs"
expire = 3600
skip_paths = ["/api/v1/health","/api/v1/info","/api/v1/auth/login","/api/v1/users"]

[cors]
allow_origins = ["*"]
allow_headers = ["Origin", "Content-Type", "Accept"]
allow_methods = ["GET","HEAD","PUT","PATCH","POST","DELETE"]
allow_credentials = true

[casbin]
# model 直接内联或使用 model_file 指向文件
model = ""
model_file = ""

[kafka]
brokers = []
client_id = "echo-admin"
topic = "demo"

[otel]
# OpenTelemetry 配置
enabled = false
# 服务名称
service_name = "go-template"
# 环境标识: dev, test, prod
environment = "dev"
# OTLP gRPC 端点地址 (当 exporter_type = "otlp" 时使用)
otlp_endpoint = "localhost:4317"
# 导出器类型: otlp (发送到 OTLP 收集器), stdout (输出到控制台)
exporter_type = "stdout"
# 采样率: 0.0 - 1.0 (1.0 = 100% 采样)
sampling_ratio = 1.0

