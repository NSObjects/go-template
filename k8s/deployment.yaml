apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-template
  labels:
    app: go-template
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-template
  template:
    metadata:
      labels:
        app: go-template
    spec:
      containers:
      - name: go-template
        image: go-template:latest
        ports:
        - containerPort: 9322
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9322
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 9322
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /configs
      volumes:
      - name: config
        configMap:
          name: go-template-config
---
apiVersion: v1
kind: Service
metadata:
  name: go-template-service
spec:
  selector:
    app: go-template
  ports:
  - port: 80
    targetPort: 9322
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-template-config
data:
  config.toml: |
    [system]
    port = ":9322"
    level = 2
    env = "prod"

    [jwt]
    enabled = false
    secret = ""
    skip_paths = ["/api/health","/api/info"]
