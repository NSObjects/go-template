apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-template
  labels:
    app: go-template
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-template
  template:
    metadata:
      labels:
        app: go-template
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: go-template
        image: go-template:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 9322
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9322
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 9322
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /configs
      volumes:
      - name: config
        configMap:
          name: go-template-config
---
apiVersion: v1
kind: Service
metadata:
  name: go-template-service
spec:
  selector:
    app: go-template
  ports:
  - port: 80
    targetPort: 9322
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-template-config
data:
  config.toml: |
    [app]
    name = "go-template"
    version = "dev"

    [system]
    port = ":9322"
    level = 2

    [log]
    format = "json"
    output = "stdout"
    caller = false

    [jwt]
    enabled = false
    skip_paths = ["/api/health","/api/info","/api/ready"]

    [mysql]
    enabled = false
    dsn = ""
    max_open_conns = 25
    max_idle_conns = 5
    conn_max_lifetime_seconds = 300
    ping_timeout_seconds = 3

    [redis]
    enabled = false
    address = ""
    username = ""
    password = ""
    db = 0
    dial_timeout_seconds = 3
    read_timeout_seconds = 3
    write_timeout_seconds = 3
    ping_timeout_seconds = 3

    [mongodb]
    enabled = false
    uri = ""
    database = ""
    connect_timeout_seconds = 3
    ping_timeout_seconds = 3

    [tracing]
    enabled = false
    endpoint = ""
    protocol = "grpc"
    insecure = true
    service_name = ""
    sample_ratio = 1.0
    shutdown_timeout_seconds = 5
