# Local development compose file. Published ports bind to localhost by default.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-template-api
    volumes:
      - ./configs/config.toml:/configs/config.toml
    ports:
      - "127.0.0.1:${GO_TEMPLATE_API_PORT:-9322}:9322"
    networks:
      - api-net

  mysql:
    image: mysql:8.4
    container_name: go-template-mysql
    environment:
      MYSQL_DATABASE: ${GO_TEMPLATE_MYSQL_DATABASE:-go_template}
      MYSQL_USER: ${GO_TEMPLATE_MYSQL_USER:-go_template}
      MYSQL_PASSWORD: ${GO_TEMPLATE_MYSQL_PASSWORD:-go_template_dev_password}
      MYSQL_ROOT_PASSWORD: ${GO_TEMPLATE_MYSQL_ROOT_PASSWORD:-go_template_dev_root_password}
    ports:
      - "127.0.0.1:${GO_TEMPLATE_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - api-net

  redis:
    image: redis:7.4-alpine
    container_name: go-template-redis
    ports:
      - "127.0.0.1:${GO_TEMPLATE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - api-net

  mongodb:
    image: mongo:8.0
    container_name: go-template-mongodb
    ports:
      - "127.0.0.1:${GO_TEMPLATE_MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - api-net

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: go-template-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${GO_TEMPLATE_JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${GO_TEMPLATE_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${GO_TEMPLATE_OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - api-net

networks:
  api-net:
    driver: bridge
